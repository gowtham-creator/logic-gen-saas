# Docker Compose configuration for PRODUCTION
# Usage:
#   Build images:  docker-compose -f docker-compose.prod.yml build
#   Start:        docker-compose -f docker-compose.prod.yml up -d
# Ensure .env has production values (JWT secrets, ENCRYPTION_KEY, DMN_PIPELINE_API_URL, etc.)

services:
  postgres:
    image: postgres:14-alpine
    container_name: multitenant-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-multitenant_saas}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: multitenant-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: log-gen-core20-backend
    container_name: multitenant-backend
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/multitenant_saas}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      API_PORT: ${API_PORT:-3001}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DEFAULT_CLIENT_ID: ${DEFAULT_CLIENT_ID:-}
      DEFAULT_CLIENT_SUBDOMAIN: ${DEFAULT_CLIENT_SUBDOMAIN:-admin}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      GLOBAL_RATE_LIMIT_MAX_REQUESTS: ${GLOBAL_RATE_LIMIT_MAX_REQUESTS:-50000}
      # DMN Pipeline (AI service) – set in .env to your DMN API base URL (e.g. https://dmn.example.com/api/v1 or http://dmn-pipeline:8000/api/v1)
      DMN_PIPELINE_API_URL: ${DMN_PIPELINE_API_URL:-}
      DMN_REQUEST_TIMEOUT_MS: ${DMN_REQUEST_TIMEOUT_MS:-180000}
      DMN_PIPELINE_RUN_TIMEOUT_MS: ${DMN_PIPELINE_RUN_TIMEOUT_MS:-300000}
      DMN_PIPELINE_TIMEOUT_MS: ${DMN_PIPELINE_TIMEOUT_MS:-30000}
    # On Linux, host.docker.internal is not set by default; needed when DMN pipeline runs on host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Expose port internally only (nginx will proxy)
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: log-gen-core20-frontend
    container_name: multitenant-frontend
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    # Expose port internally only (nginx will proxy)
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: log-gen-core20-nginx
    container_name: multitenant-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  redis_data:

