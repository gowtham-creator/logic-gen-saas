name: Security Scan

on:
  schedule:
    # Run weekly on Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allow manual triggering

# Default permissions for all jobs
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check for package-lock.json
        id: check-lockfile
        run: |
          if [ -f "${{ matrix.directory }}/package-lock.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: ${{ steps.check-lockfile.outputs.exists == 'true' && 'npm' || '' }}
          cache-dependency-path: ${{ steps.check-lockfile.outputs.exists == 'true' && format('{0}/package-lock.json', matrix.directory) || '' }}
          check-latest: true

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Run npm audit
        working-directory: ${{ matrix.directory }}
        run: |
          npm audit --audit-level=moderate || true
          npm audit --json > ../security-reports/npm-audit-${{ matrix.directory }}-$(date +%Y%m%d).json || true

      - name: Upload audit results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: npm-audit-${{ matrix.directory }}
          path: security-reports/npm-audit-${{ matrix.directory }}*.json
          retention-days: 30

  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        directory: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check for package-lock.json
        id: check-lockfile
        run: |
          if [ -f "${{ matrix.directory }}/package-lock.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: ${{ steps.check-lockfile.outputs.exists == 'true' && 'npm' || '' }}
          cache-dependency-path: ${{ steps.check-lockfile.outputs.exists == 'true' && format('{0}/package-lock.json', matrix.directory) || '' }}
          check-latest: true

      - name: Install Snyk
        run: npm install -g snyk

      - name: Run Snyk to check for vulnerabilities
        working-directory: ${{ matrix.directory }}
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --severity-threshold=high --json > ../snyk-results-${{ matrix.directory }}.json || true
          snyk test --severity-threshold=high || true

      - name: Upload Snyk results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: snyk-results-${{ matrix.directory }}
          path: snyk-results-${{ matrix.directory }}.json
          retention-days: 30

  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      security-events: write
      actions: read
      contents: read
      id-token: write
    strategy:
      matrix:
        dockerfile: [backend/Dockerfile, frontend/Dockerfile, nginx/Dockerfile]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          sarif_file: 'trivy-results.sarif'
          wait-for-processing: false
          category: 'trivy-container-scan'

  code-quality:
    name: Code Quality & Security Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check for package-lock.json
        id: check-lockfile
        run: |
          if [ -f "backend/package-lock.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: ${{ steps.check-lockfile.outputs.exists == 'true' && 'npm' || '' }}
          cache-dependency-path: ${{ steps.check-lockfile.outputs.exists == 'true' && 'backend/package-lock.json' || '' }}
          check-latest: true

      - name: Install dependencies
        working-directory: backend
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Run ESLint
        working-directory: backend
        run: npm run lint || true

      - name: Run TypeScript type check
        working-directory: backend
        run: npm run typecheck || true

  security-summary:
    name: Generate Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, snyk-scan, container-scan]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: security-reports

      - name: Generate summary
        run: |
          echo "# Security Scan Summary" > security-summary.md
          echo "" >> security-summary.md
          echo "**Date:** $(date)" >> security-summary.md
          echo "**Workflow Run:** ${{ github.run_number }}" >> security-summary.md
          echo "" >> security-summary.md
          echo "## Scan Results" >> security-summary.md
          echo "" >> security-summary.md
          echo "All security scan reports have been generated." >> security-summary.md
          echo "Review the artifacts for detailed findings." >> security-summary.md

      - name: Upload summary
        uses: actions/upload-artifact@v6
        with:
          name: security-summary
          path: security-summary.md
          retention-days: 90

