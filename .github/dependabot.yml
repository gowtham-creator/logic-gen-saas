# Dependabot configuration for automated security updates
# https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  # Enable version updates for npm (backend)
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 100
    reviewers:
      - "security-team"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group all patch and minor updates together to reduce PR noise
    # Security updates bypass grouping and create separate PRs (this is expected)
    groups:
      all-patch-minor-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # Enable version updates for npm (frontend)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 50
    reviewers:
      - "security-team"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group all patch and minor updates together to reduce PR noise
    # Security updates bypass grouping and create separate PRs (this is expected)
    groups:
      all-patch-minor-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # Enable version updates for Docker
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"

  - package-ecosystem: "docker"
    directory: "/nginx"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"

